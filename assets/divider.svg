<svg xmlns="http://www.w3.org/2000/svg" width="720" height="12" viewBox="0 0 720 12" role="img" aria-label="Gradient divider">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".28" stop-color="#38bdf8"/>
      <stop offset=".72" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="5" width="720" height="2" rx="1" fill="url(#line)"/>
  <circle cx="360" cy="6" r="5" fill="#818cf8" opacity=".9">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
