name: Update contribution snake

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#eff1f5,#bae6fd,#7dd3fc,#818cf8,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#1e3a5f,#2563eb,#818cf8,#c4b5fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated images
        shell: bash
        run: |
          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add --track -b output /tmp/snake-output origin/output
          else
            git worktree add --detach /tmp/snake-output
            cd /tmp/snake-output
            git checkout --orphan output
            git rm -rf .
            cd "$GITHUB_WORKSPACE"
          fi
          cp dist/*.svg /tmp/snake-output/
          cd /tmp/snake-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update contribution snake"
            git push origin HEAD:output
          fi
